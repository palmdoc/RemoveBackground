<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Remover</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Image Background Remover</h1>
      <p>Upload an image and download a PNG with a transparent background.</p>

      <form id="upload-form" class="card">
        <label for="image">Choose an image</label>
        <input id="image" name="image" type="file" accept="image/*" required />
        <button type="submit">Remove Background</button>
      </form>

      <section id="status" class="status" aria-live="polite"></section>
      <img id="preview" class="preview" alt="Processed preview" hidden />
    </main>

    <script>
      const form = document.getElementById("upload-form");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Processing image...";

        const fileInput = document.getElementById("image");
        const file = fileInput.files[0];

        if (!file) {
          status.textContent = "Please select an image first.";
          return;
        }

        const formData = new FormData();
        formData.append("image", file);

        try {
          const response = await fetch("/remove-background", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || "Failed to remove background.");
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);

          preview.src = url;
          preview.hidden = false;

          const a = document.createElement("a");
          a.href = url;
          a.download = "background-removed.png";
          document.body.appendChild(a);
          a.click();
          a.remove();

          status.textContent = "Done! Your processed image is downloading.";
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
