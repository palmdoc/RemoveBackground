<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Remover</title>
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Image Background Remover</h1>
      <p>Upload an image and download a PNG with a transparent background.</p>

      <form id="upload-form" class="card">
        <label for="image">Choose an image</label>
        <input id="image" name="image" type="file" accept="image/*" required />
        <button type="submit">Remove Background</button>
      </form>

      <section id="status" class="status" aria-live="polite"></section>
      <img id="preview" class="preview" alt="Processed preview" hidden />
    </main>

    <script type="module">
      import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

      const form = document.getElementById("upload-form");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const fileInput = document.getElementById("image");
        const file = fileInput.files[0];

        if (!file) {
          status.textContent = "Please select an image first.";
          return;
        }

        status.textContent = "Processing image. This can take a few seconds...";

        try {
          const blob = await removeBackground(file, {
            progress: (key, current, total) => {
              if (!total) return;
              const percent = Math.round((current / total) * 100);
              status.textContent = `${key}: ${percent}%`;
            },
          });

          const url = URL.createObjectURL(blob);
          preview.src = url;
          preview.hidden = false;

          const a = document.createElement("a");
          a.href = url;
          a.download = "background-removed.png";
          a.click();

          status.textContent = "Done! Download started and preview updated.";
        } catch (error) {
          status.textContent = `Failed to remove background: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
