<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Remover</title>
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Image Background Remover</h1>
      <p>Upload an image and download a PNG with a transparent background.</p>

      <form id="upload-form" class="card">
        <label for="image">Choose an image</label>
        <input id="image" name="image" type="file" accept="image/*" required />
        <button type="submit">Remove Background</button>
      </form>

      <section id="status" class="status" aria-live="polite"></section>
      <img id="preview" class="preview" alt="Processed preview" hidden />


      <!-- Bottom actions -->
      <div class="bottom-actions" style="display:flex;flex-direction:column;align-items:center;gap:20px;margin:32px 0;">
        <a href="https://palmdoc.net/vibecode"
           style="display:inline-block;padding:12px 20px;border-radius:12px;
                  border:1px solid #22304a;background:#0f1f40;color:#e9eef7;
                  text-decoration:none;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;">
          ← Back to Vibecode
        </a>

        <div style="display:flex;justify-content:center;">
          <script type="text/javascript"
            src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
            data-name="bmc-button"
            data-slug="palmdoc"
            data-color="#5F7FFF"
            data-emoji=""
            data-font="Cookie"
            data-text="Buy me a coffee"
            data-outline-color="#000000"
            data-font-color="#ffffff"
            data-coffee-color="#FFDD00">
          </script>
        </div>
      </div>
    </main>

    <script type="module">
      import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

      const form = document.getElementById("upload-form");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const fileInput = document.getElementById("image");
        const file = fileInput.files[0];

        if (!file) {
          status.textContent = "Please select an image first.";
          return;
        }

        status.textContent = "Processing image. This can take a few seconds...";

        try {
          const blob = await removeBackground(file, {
            progress: (key, current, total) => {
              if (!total) return;
              const percent = Math.round((current / total) * 100);
              status.textContent = `${key}: ${percent}%`;
            },
          });

          const url = URL.createObjectURL(blob);
          preview.src = url;
          preview.hidden = false;

          const a = document.createElement("a");
          a.href = url;
          a.download = "background-removed.png";
          a.click();

          status.textContent = "Done! Download started and preview updated.";
        } catch (error) {
          status.textContent = `Failed to remove background: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
